name: Build and Artifacts

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-api:
    name: Build API (Golang)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          
      - name: Build API Binary
        working-directory: ./apps/api
        run: |
          go mod tidy
          go build -o dboke-api ./cmd/api/main.go
          
      - name: Upload API Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dboke-api-binary
          path: ./apps/api/dboke-api

  build-web:
    name: Build Web (Next.js Static HTML)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Export Static HTML
        working-directory: ./apps/web
        run: |
          # Set Next.js to export static traditional HTML files
          npm run build
        env:
          NEXT_PUBLIC_API_URL: /api

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dboke-web-html
          path: ./apps/web/out
